    项目链接         |

    |----------------|------------------------------|--------|--------|----------------|------------------|

    | Scikit-learn   | 机器学习和数据挖掘工具       | Python | 10000  | 2023-04-05     | https://github.com/scikit-learn/scikit-learn
    |

    | TensorFlow     | 开源机器学习框架              | Python | 80000  | 2023-05-10     |
    https://github.com/tensorflow/tensorflow     |

    | PyTorch         | 用于深度学习的开源框架       | Python | 70000  | 2023-06-02     | https://github.com/pytorch/pytorch           |'
  pre_prompt: '```xml

    <instruction>

    请根据提供的主题，搜索 GitHub 上相关的优秀开源项目，并将它们整理成一张清晰的表格。表格应包含项目名称、简介、语言、星标数、更新时间、项目链接等基本信息。整理过程中，请确保信息准确，并按照项目的活跃度与受欢迎程度对结果进行排序。最终输出应为标准的
    Markdown 格式，且不含任何 XML 标签。

    </instruction>


    <input>

    <topic> {{topic}} </topic>

    </input>


    <output>

    请以 Markdown 格式输出一个表格，表格应包含以下列：项目名称、简介、语言、星标数、更新时间、项目链接。确保表格内容整洁、格式规范。

    </output>


    <example>

    如果输入主题为 "机器学习"，则应输出类似以下的 Markdown 表格：


    | 项目名称       | 简介                         | 语言   | 星标数 | 更新时间       | 项目链接         |

    |----------------|------------------------------|--------|--------|----------------|------------------|

    | Scikit-learn   | 机器学习和数据挖掘工具       | Python | 10000  | 2023-04-05     | https://github.com/scikit-learn/scikit-learn
    |

    | TensorFlow     | 开源机器学习框架              | Python | 80000  | 2023-05-10     |
    https://github.com/tensorflow/tensorflow     |

    | PyTorch         | 用于深度学习的开源框架       | Python | 70000  | 2023-06-02     | https://github.com/pytorch/pytorch           |

    </example>

    ```'
  prompt_type: simple
